name: Patatatube Auto-Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk Patatatube-v${{ env.APP_VERSION }}.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "🥔 Patatatube v${{ env.APP_VERSION }} — The Resilient YouTube Edition ⚡"
          body: |
            ## 🥔 Patatatube Mobile v${{ env.APP_VERSION }} 🎧
            
            > **¡YouTube ha vuelto a doblar la rodilla!** Esta versión 1.2.0 reconstruye por completo el subsistema de descargas para superar las restricciones recientes impuestas por Google (SABR streaming, 403 Forbidden y bloqueos de PO Tokens).
            
            ---
            
            ### 🚀 ¿Qué hay de nuevo en esta versión?
            
            #### 🛡️ Bypass Definitivo de YouTube (Error 403 / SABR Streaming)
            - YouTube empezó a exigir streaming adaptativo **SABR** y tokens de integridad en clientes antiguos y web.
            - Patatatube ahora integra de serie el motor **yt-dlp Nightly**, utilizando el cliente moderno `visionos` que descarga audio y vídeo a máxima velocidad sin bloqueos ni requerir motores de JavaScript externos.
            
            #### 📦 Motor yt-dlp Fresco Integrado de Serie
            - Ya no dependes de que la app descargue el motor tras instalarla: el APK ya viene precargado con la versión **Nightly más reciente**.
            - Se incluye un detector automático en el arranque: si instalas una nueva versión de Patatatube, el binario del almacenamiento interno se actualiza al instante sin líos de caché.
            
            #### 🔄 Actualizador In-App Mejorado & Canal NIGHTLY
            - El actualizador integrado (manteniendo pulsado el botón `>_` de la terminal) ahora apunta prioritariamente al canal **NIGHTLY**, donde se publican los parches inmediatos ante cualquier cambio de YouTube, con fallback automático a **STABLE**.
            - Corregido el bug donde la app reportaba falsamente `already_up_to_date` debido a registros antiguos en `SharedPreferences`.
            
            #### 🎬 Selector de Vídeo Universal & Remuxing FFmpeg
            - Ahora selecciona automáticamente la combinación de **mejor vídeo + mejor audio** sin restricciones arbitrarias de formato y utiliza FFmpeg para empaquetarlo limpiamente en un contenedor `.mp4`.
            - Añadida bandera `--no-update` en las solicitudes para silenciar las molestas advertencias de antigüedad en la consola.
            
            ---
            
            ### 📲 Instalación
            
            1. Descarga el archivo adjunto **`Patatatube-v${{ env.APP_VERSION }}.apk`**.
            2. Ábrelo en tu teléfono Android e instálalo.
               > ⚠️ *Nota:* Si tenías instalada una compilación de desarrollo (debug), es posible que Android pida desinstalarla primero debido a la diferencia de certificados de firma.
            3. ¡Disfruta descargando tus vídeos y música favoritos a máxima calidad! 🥔✨
            
            ---
            
            *Diseñado con estilo por **pokeinalover** | Desarrollado con ❤️ y mala leche por **ContratopDev***
          files: Patatatube-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
